    sections.forEach((section, index) => {
      const article = document.createElement("article");
      article.className = "card";
      article.dataset.title = section.title.toLowerCase();
      article.innerHTML = `<button class="card-head" type="button" aria-expanded="false" aria-controls="panel-${index}"><span class="index">${String(index + 1).padStart(2,"0")}</span><span><span class="card-title">${escapeHTML(section.title)}</span><span class="meta">${section.topics.length} тем</span></span><span class="toggle" aria-hidden="true">+</span></button><div class="panel" id="panel-${index}"><div class="panel-inner"><ol class="topic-list">${section.topics.map(topic => `<li class="topic" data-text="${escapeHTML(topic.toLowerCase())}"><span>${escapeHTML(topic)}</span></li>`).join("")}</ol></div></div>`;
      const button = article.querySelector(".card-head");
      button.addEventListener("click", () => {
        const isOpen = article.classList.toggle("open");
        button.setAttribute("aria-expanded", String(isOpen));
      });
      grid.append(article);
      cards.push(article);
    });

    const topicTotal = sections.reduce((sum, section) => sum + section.topics.length, 0);
    document.querySelector("#sectionCount").textContent = `${sections.length} РАЗДЕЛОВ`;
    document.querySelector("#topicCount").textContent = `${topicTotal} ТЕМ`;

    const setAll = open => cards.filter(card => !card.hidden).forEach(card => {
      card.classList.toggle("open", open);
      card.querySelector(".card-head").setAttribute("aria-expanded", String(open));
    });
    document.querySelector("#expandAll").addEventListener("click", () => setAll(true));
    document.querySelector("#collapseAll").addEventListener("click", () => setAll(false));

    search.addEventListener("input", event => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCards = 0;
      cards.forEach(card => {
        const titleMatch = card.dataset.title.includes(query);
        let visibleTopics = 0;
        card.querySelectorAll(".topic").forEach(topic => {
          const match = !query || titleMatch || topic.dataset.text.includes(query);
          topic.hidden = !match;
          if (match) visibleTopics++;
        });
        const visible = !query || titleMatch || visibleTopics > 0;
        card.hidden = !visible;
        if (visible) visibleCards++;
        if (query && visible) {
          card.classList.add("open");
          card.querySelector(".card-head").setAttribute("aria-expanded", "true");
        }
      });
      empty.style.display = visibleCards ? "none" : "block";
    });

    const observer = new IntersectionObserver(entries => entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add("visible"); observer.unobserve(entry.target); }
    }), { threshold:.08 });
    cards.forEach((card, index) => { card.style.transitionDelay = `${Math.min(index % 6, 5) * 55}ms`; observer.observe(card); });
  </script>
</body>
</html>
